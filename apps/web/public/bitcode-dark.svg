  <rect x="48" y="18" width="4" height="4" fill="#7CFF6B"/>
  <rect x="48" y="22" width="4" height="4" fill="#7CFF6B"/>
  <rect x="46" y="26" width="4" height="4" fill="#7CFF6B"/>

