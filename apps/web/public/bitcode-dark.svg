<svg width="180" height="60" viewBox="0 0 180 60" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">

  <!-- ── Pixel art laptop icon (0,0 → 64,60) ── -->

  <!-- Screen outer frame - chunky pixel border -->
  <rect x="4"  y="2"  width="56" height="4"  fill="#6a6a8a"/>
  <rect x="4"  y="2"  width="4"  height="40" fill="#6a6a8a"/>
  <rect x="56" y="2"  width="4"  height="40" fill="#5a5a7a"/>
  <rect x="4"  y="38" width="56" height="4"  fill="#5a5a7a"/>

  <!-- Corner accent pixels -->
  <rect x="4"  y="2"  width="4" height="4" fill="#888aaa"/>
  <rect x="56" y="2"  width="4" height="4" fill="#888aaa"/>
  <rect x="4"  y="38" width="4" height="4" fill="#444466"/>
  <rect x="56" y="38" width="4" height="4" fill="#444466"/>

  <!-- Screen interior -->
  <rect x="8" y="6" width="48" height="32" fill="#0d0d2e"/>

  <!-- Green pixel art < -->
  <rect x="14" y="14" width="4" height="4" fill="#7CFF6B"/>
  <rect x="12" y="18" width="4" height="4" fill="#7CFF6B"/>
  <rect x="12" y="22" width="4" height="4" fill="#7CFF6B"/>
  <rect x="14" y="26" width="4" height="4" fill="#7CFF6B"/>

  <!-- Green pixel art / -->
  <rect x="28" y="28" width="4" height="4" fill="#7CFF6B"/>
  <rect x="30" y="24" width="4" height="4" fill="#7CFF6B"/>
  <rect x="32" y="20" width="4" height="4" fill="#7CFF6B"/>
  <rect x="34" y="16" width="4" height="4" fill="#7CFF6B"/>

  <!-- Green pixel art > -->
  <rect x="46" y="14" width="4" height="4" fill="#7CFF6B"/>
  <rect x="48" y="18" width="4" height="4" fill="#7CFF6B"/>
  <rect x="48" y="22" width="4" height="4" fill="#7CFF6B"/>
  <rect x="46" y="26" width="4" height="4" fill="#7CFF6B"/>

  <!-- Cursor underscore -->
  <rect x="12" y="32" width="12" height="3" fill="#7CFF6B"/>

  <!-- Keyboard base -->
  <rect x="2"  y="42" width="60" height="8"  fill="#555577"/>
  <rect x="2"  y="50" width="60" height="4"  fill="#444466"/>

  <!-- Keyboard dot row -->
  <rect x="10" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="16" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="22" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="28" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="34" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="40" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="46" y="45" width="3" height="3" fill="#3a3a5a"/>
  <rect x="52" y="45" width="3" height="3" fill="#3a3a5a"/>

  <!-- ── Text: BitCode ── -->
  <text x="74" y="38" font-family="'Courier New', Courier, monospace" font-size="26" font-weight="900" letter-spacing="-0.5">
    <tspan fill="#ffffff">Bit</tspan><tspan fill="#8A5CFF">Code</tspan>
  </text>

</svg>
