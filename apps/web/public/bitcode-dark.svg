  <rect x="4"  y="2"  width="4"  height="40" fill="#6a6a8a"/>
  <rect x="56" y="2"  width="4"  height="40" fill="#5a5a7a"/>
  <rect x="4"  y="38" width="56" height="4"  fill="#5a5a7a"/>

